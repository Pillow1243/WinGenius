[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wingenius"
version = "7.1.0"
description = "WinGenius — a Persian-first, all-in-one Windows toolbox (290 tools, 11 categories)"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
authors = [{ name = "Pillow1243" }]
keywords = ["windows", "toolbox", "pdf", "images", "automation", "persian", "qt"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Persian",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
# This list is the single source of truth for runtime dependencies.
# `scripts/check_deps.py` verifies requirements.txt stays in sync with it.
dependencies = [
    "PySide6-Essentials>=6.6,<7",
    "pypdf>=4.2",
    "PyMuPDF>=1.24",
    "pyHanko>=0.30,<0.41",
    "reportlab>=4.0",
    "Pillow>=10.2",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "qrcode>=7.4",
    "python-barcode>=0.15",
    "pyzipper>=0.3.6",
    "cryptography>=42.0",
    "psutil>=5.9",
    "requests>=2.31",
    "markdown>=3.5",
    "mss>=9.0",
    "imageio-ffmpeg>=0.4.9",
    "opencv-python-headless>=4.9,<5; platform_system != 'Darwin'",
    "pytesseract>=0.3.10",
    "dnspython>=2.6",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Whisper models are large and downloaded on demand; keep the engine opt-in.
media = ["faster-whisper>=1.0"]
build = ["pyinstaller>=6.6"]
dev = ["ruff>=0.6", "coverage>=7.6", "pytest>=8.0", "pre-commit>=3.7", "mypy>=1.10"]

[project.scripts]
wingenius = "app.bootstrap:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "packaging*", "docs*", "scripts*"]
namespaces = false

[tool.setuptools.package-data]
app = ["assets/*.png", "assets/*.ico", "py.typed"]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [".git", "dist", "build", "__pycache__", "docs"]

[tool.ruff.lint]
# Only rules that catch real bugs. Style churn is not worth a red CI.
select = ["E9", "F4", "F63", "F7", "F82", "F811"]
ignore = ["F401"]          # re-exports in package __init__ files are intentional

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
addopts = "-q --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
branch = false
omit = ["app/assets/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# A gate, not a decoration: coverage may grow but must never silently shrink.
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
follow_imports = "silent"
exclude = ["tests/", "packaging/", "docs/"]
