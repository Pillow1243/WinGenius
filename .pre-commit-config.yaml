# pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(app|tests|packaging|scripts)/.*\.py$|^main\.py$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
        exclude: ^docs/showcase\.html$
      - id: trailing-whitespace
        exclude: ^docs/showcase\.html$
      - id: check-added-large-files
        args: [--maxkb=9000]
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: check-deps
        name: dependency lists in sync
        entry: python scripts/check_deps.py
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|requirements\.txt)$
      - id: check-docs
        name: documented numbers match the code
        entry: python scripts/check_docs.py
        language: system
        pass_filenames: false
        files: ^(README\.md|docs/|CHANGELOG\.md|packaging/version_info\.txt)
