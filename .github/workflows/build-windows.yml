name: Build Windows exe

# Two independent entry points, no double build:
#   • a v* tag push builds that exact tag
#   • a manual run builds HEAD (or an explicit release_tag)
# The old `release: published` trigger raced the tag-push trigger and produced
# two builds of the same commit.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build (empty = current branch HEAD)"
        required: false
        default: ""
        type: string
      build_installer:
        description: "Also compile the Inno Setup installer"
        required: false
        default: true
        type: boolean
      build_onedir:
        description: "Also build the onedir bundle"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v*"

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 90
    outputs:
      version: ${{ steps.meta.outputs.version }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      WINGENIUS_NO_LAUNCH: "1"
    steps:
      # ---------------------------------------------------------------- setup
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.ref_name }}" }
          if ($tag -notmatch '^v') { $tag = "" }
          $version = if ($tag) { $tag.TrimStart('v') } else { "5.0.1-dev" }
          "tag=$tag"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Sync version constants (tagged builds only)
        if: steps.meta.outputs.tag != ''
        shell: python
        run: |
          import re
          from pathlib import Path

          tag, version = "${{ steps.meta.outputs.tag }}", "${{ steps.meta.outputs.version }}"

          def rewrite(path, pattern, replacement):
              file = Path(path)
              text = file.read_text(encoding="utf-8-sig")
              text, count = re.subn(pattern, replacement, text, flags=re.M)
              if not count:
                  raise SystemExit(f"no match for {pattern!r} in {path}")
              file.write_text(text, encoding="utf-8")

          # `re.M` is already passed by rewrite(); an inline (?m) after ^ is a
          # SyntaxError in Python 3.11+ ("global flags not at the start").
          rewrite("app/core/paths.py", r'^APP_VERSION = "[^"]+"', f'APP_VERSION = "{version}"')
          rewrite("pyproject.toml", r'^version = "[^"]+"', f'version = "{version}"')
          # docs/stats.json is check_docs.py's canonical version, so it MUST move
          # with the tag or the quality gate below fails on every release build.
          rewrite("docs/stats.json", r'"version":\s*"[^"]+"', f'"version": "{version}"')
          nums = ", ".join((version.split(".") + ["0"] * 4)[:4])
          rewrite("packaging/version_info.txt", r"filevers=\([^)]*\)", f"filevers=({nums})")
          rewrite("packaging/version_info.txt", r"prodvers=\([^)]*\)", f"prodvers=({nums})")
          rewrite("packaging/version_info.txt", r"StringStruct\('FileVersion', '[^']+'\)",
                  f"StringStruct('FileVersion', '{version}.0')")
          rewrite("packaging/version_info.txt", r"StringStruct\('ProductVersion', '[^']+'\)",
                  f"StringStruct('ProductVersion', '{version}.0')")
          rewrite("packaging/installer.iss", r'^#define AppVersion "[^"]+"',
                  f'#define AppVersion "{version}"')

      - name: Install runtime + build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip check

      - name: Install Inno Setup
        if: inputs.build_installer != false
        shell: pwsh
        run: choco install innosetup -y --no-progress

      # ------------------------------------------------------- quality gate
      - name: Test the source tree before packaging it
        shell: pwsh
        run: |
          python scripts/check_deps.py
          python scripts/check_release.py
          python scripts/check_docs.py
          python main.py --doctor
          python -m compileall -q app tests packaging main.py
          python tests/smoke_test.py
          python tests/functional_test.py
          python tests/output_test.py
          python tests/security_test.py

      # --------------------------------------------------------------- build
      - name: Build onefile exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean packaging/WinGenius.spec
          $exe = "dist/WinGenius.exe"
          if (-not (Test-Path $exe)) { throw "onefile exe missing: $exe" }

      - name: Build onedir bundle
        if: inputs.build_onedir != false
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --name WinGenius-onedir `
            --windowed --icon app/assets/icon.ico `
            --add-data "app/assets;app/assets" `
            --collect-submodules app.tools `
            --hidden-import pyhanko --collect-submodules pyhanko `
            --hidden-import pytesseract `
            --exclude-module PySide6.QtWebEngineCore `
            --exclude-module PySide6.Qt3DCore `
            --exclude-module tkinter `
            --distpath dist-onedir --workpath build/onedir --specpath build main.py
          if (-not (Test-Path "dist-onedir/WinGenius-onedir/WinGenius-onedir.exe")) {
            throw "onedir exe missing"
          }

      - name: Compile Inno Setup installer
        if: inputs.build_installer != false
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $setup = Get-ChildItem dist -Filter "WinGenius-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "installer missing in dist/" }

      # --------------------------------------------------------------- smoke
      - name: Smoke-test the frozen exe (version, doctor, tool list)
        shell: python
        run: |
          import os
          import subprocess

          env = dict(os.environ, QT_QPA_PLATFORM="offscreen", WINGENIUS_NO_LAUNCH="1",
                     WINGENIUS_SKIP_SELFTEST="1")
          exe = "dist/WinGenius.exe"

          def run(*args, timeout=180):
              proc = subprocess.run([exe, *args], env=env, capture_output=True,
                                   text=True, timeout=timeout,
                                   creationflags=0x08000000)
              out = (proc.stdout or "") + (proc.stderr or "")
              print(f"$ WinGenius.exe {' '.join(args)}\n{out[-1200:]}")
              if proc.returncode != 0:
                  raise SystemExit(f"exit {proc.returncode} for {' '.join(args)}")
              return out

          out = run("--version")
          assert "${{ steps.meta.outputs.version }}" in out or "5.0.1" in out, out

          out = run("--doctor")
          # A windowed (runw.exe) binary whose stdout is a pipe cannot always
          # re-attach to a console, so its diagnostics may be empty here even
          # though `--version` above printed. `python main.py --doctor` is run
          # from source in the quality gate, where output is guaranteed.
          if out.strip():
              assert "WinGenius" in out or "PySide6" in out, out

          out = run("--list", "--json")
          # The exact count catches a bundle that forgot to collect app.tools.*:
          # it used to print `[]` and still exit 0.
          ids = out.count('"id"')
          assert ids >= 250, f"only {ids} tools in the frozen exe: {out[:300]}"

          out = run("--describe", "pdf_signature_check")
          assert "pdf" in out.lower(), out

      - name: Verify signing engine is actually bundled
        shell: python
        run: |
          # pyHanko is imported lazily, so a static import test cannot prove
          # that the frozen exe carries it.  Run the real tool instead.
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          from reportlab.pdfgen import canvas

          work = Path(tempfile.mkdtemp())
          pdf = work / "unsigned.pdf"
          canvas.Canvas(str(pdf)).drawString(72, 720, "signature probe").save()
          env = dict(os.environ, QT_QPA_PLATFORM="offscreen", WINGENIUS_NO_LAUNCH="1")
          proc = subprocess.run(
              ["dist/WinGenius.exe", "--run", "pdf_signature_check",
               "--file", str(pdf)],
              env=env, capture_output=True, text=True, timeout=180,
              creationflags=0x08000000)
          combined = (proc.stdout or "") + (proc.stderr or "")
          print(combined[-1500:])
          # A missing engine used to produce "pip install pyHanko" at runtime;
          # an unsigned PDF is a normal tool-level failure, not a crash.
          if "pip install" in combined.lower() or "module not found" in combined.lower():
              raise SystemExit("pyHanko was not bundled into the exe")

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/WinGenius.exe release/WinGenius-${{ steps.meta.outputs.version }}.exe
          $setup = Get-ChildItem dist -Filter "WinGenius-Setup-*.exe" | Select-Object -First 1
          if ($setup) {
            Copy-Item $setup.FullName release/WinGeniusSetup-${{ steps.meta.outputs.version }}.exe
          }
          if (Test-Path "dist-onedir/WinGenius-onedir") {
            Compress-Archive -Path "dist-onedir/WinGenius-onedir/*" `
              -DestinationPath "release/WinGenius-${{ steps.meta.outputs.version }}-onedir.zip" -Force
          }
          # Reproducible checksums so users can verify what they downloaded.
          Get-ChildItem release -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Out-File -FilePath release/SHA256SUMS.txt -Encoding utf8
          Get-ChildItem release | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wingenius-${{ steps.meta.outputs.version }}-${{ github.run_number }}
          path: release/*
          retention-days: 14
          if-no-files-found: error

  release:
    # Only this job can write; the build job above runs with read-only access.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wingenius-${{ needs.build.outputs.version }}-${{ github.run_number }}
          path: release
      - name: Attach files to the published release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
          append_body: true
          body: |
            **Windows builds attached by CI** (run `${{ github.run_number }}`).
            Verify your download with the `SHA256SUMS.txt` in this release.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
