name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  QT_QPA_PLATFORM: offscreen
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # A native crash in Qt used to kill the job with no traceback; faulthandler turns
  # that into a readable stack in the log.
  PYTHONFAULTHANDLER: "1"
  # Launch-only tools (applets, "open folder") must not spawn windows on a runner.
  WINGENIUS_NO_LAUNCH: "1"

jobs:
  # Fast feedback: syntax/lint/registry sanity before the heavy suites.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q ruff
      - name: Ruff (real errors only)
        run: ruff check main.py app tests packaging scripts
      - name: Compile every module
        run: python -m compileall -q app packaging tests scripts main.py
      - name: Dependency lists are in sync
        run: python scripts/check_deps.py
      - name: Documented numbers match the code
        run: |
          python scripts/stats.py --check
          python scripts/check_docs.py
      - name: Windows build inputs are consistent
        run: python packaging/verify_package.py
      - name: Tagged release version sync works
        run: python scripts/check_release.py

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.11 is deliberately not in the matrix: CPython 3.11.17 + current PySide6
        # aborts with `none_dealloc` inside the radial-menu paint code, and the
        # project therefore declares 3.12 as the minimum supported version.
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbcommon0 libegl1 libglib2.0-0 libfontconfig1 \
            libdbus-1-3 libxcb-cursor0 tesseract-ocr tesseract-ocr-eng

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt
          python -m pip install -q coverage ruff pytest
          python -m pip check

      - name: Tool registry sanity
        shell: bash                      # `> /dev/null` is not valid PowerShell
        run: |
          python main.py --version
          python main.py --list --json > /dev/null
          python main.py --doctor

      - name: Smoke suite
        run: python -X faulthandler -m coverage run --parallel-mode --source=app tests/smoke_test.py

      - name: Functional suite
        run: python -X faulthandler -m coverage run --parallel-mode --source=app tests/functional_test.py

      - name: Output-correctness suite (incl. pyHanko signatures)
        run: python -X faulthandler -m coverage run --parallel-mode --source=app tests/output_test.py

      - name: UI suite (offscreen Qt)
        run: python -X faulthandler -m coverage run --parallel-mode --source=app tests/ui_test.py

      - name: Security & consistency regressions
        run: python -X faulthandler -m coverage run --parallel-mode --source=app tests/security_test.py

      - name: Persian / RTL PDF engine suite
        run: python -X faulthandler -m coverage run --parallel-mode --source=app -m pytest -q tests/persian_pdf_test.py tests/hardening_test.py tests/audit_regression_test.py

      - name: pytest entry point (the legacy suites now have fixtures)
        run: python -m pytest -q

      - name: Coverage gate
        run: |
          python -m coverage combine
          python -m coverage report --skip-covered --skip-empty
          python -m coverage xml -o coverage.xml
          # fail_under in pyproject.toml makes the line above a real gate.

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: warn

  package-check:
    # Proves the wheel really builds and imports (used to fail with
    # "Multiple top-level packages discovered in a flat-layout").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate spec + installer references
        run: python packaging/verify_package.py
      - name: Build a wheel
        run: |
          python -m pip install -q --upgrade pip build
          python -m build --wheel --sdist --outdir dist-check
          ls -lh dist-check
      - name: Wheel imports cleanly
        run: |
          python -m pip install -q --no-deps --target /tmp/wg-wheel-install dist-check/*.whl
          cd /tmp && PYTHONPATH=/tmp/wg-wheel-install python -c "import app.core.registry; from app.core.paths import resource_path; assert resource_path('fonts', 'Vazirmatn-Regular.ttf').is_file(); assert resource_path('fonts', 'OFL.txt').is_file(); print('wheel import and fonts OK')"
