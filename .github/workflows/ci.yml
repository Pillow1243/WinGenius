name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  QT_QPA_PLATFORM: offscreen
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # A native crash in Qt used to kill the job with no traceback; faulthandler turns
  # that into a readable stack in the log.
  PYTHONFAULTHANDLER: "1"

jobs:
  # Fast feedback: syntax/lint/registry sanity before the heavy suites.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q ruff
      - name: Ruff (real errors only)
        run: ruff check main.py app tests packaging
      - name: Compile every module
        run: python -m compileall -q app packaging tests main.py

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.11 is deliberately not in the matrix: CPython 3.11.17 + current PySide6
        # aborts with `none_dealloc` inside the radial-menu paint code, and the
        # project therefore declares 3.12 as the minimum supported version.
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbcommon0 libegl1 libglib2.0-0 libfontconfig1 \
            libdbus-1-3 libxcb-cursor0 tesseract-ocr tesseract-ocr-eng

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt
          python -m pip install -q coverage ruff

      - name: Tool registry sanity
        shell: bash                      # `> /dev/null` is not valid PowerShell
        run: |
          python main.py --version
          python main.py --list --json > /dev/null

      - name: Smoke suite
        run: python -X faulthandler -m coverage run --parallel-mode --source=app tests/smoke_test.py

      - name: Functional suite
        run: python -X faulthandler -m coverage run --parallel-mode --source=app tests/functional_test.py

      - name: Output-correctness suite
        run: python -X faulthandler -m coverage run --parallel-mode --source=app tests/output_test.py

      - name: UI suite (offscreen Qt)
        run: python -X faulthandler -m coverage run --parallel-mode --source=app tests/ui_test.py

      - name: Coverage gate
        run: |
          python -m coverage combine
          python -m coverage report --skip-covered --skip-empty
          python -m coverage xml -o coverage.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: warn

  package-check:
    # Proves the Windows build files are consistent even when we cannot run the exe.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate spec + installer references
        run: python packaging/verify_package.py
